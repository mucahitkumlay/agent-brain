<script src="main.js"></script>
<script>(function(){
const groupsSpec=[['hubs/',13],['people/',120],['projects/api/',74],['notes/',60],['projects/docs/',17],['plugins/',22],['docs/',9],['kernel/',2],['references/',4],['journal/',30],['tools/',8],['security/',6]];
const hubNames=['home','index','projects','people','api','docs','security','memory','plan','brief','agents','tools','glossary'];
const files=[];for(const [g,c] of groupsSpec)for(let i=0;i<c;i++){const nm=g.includes('hubs')?hubNames[i]:g.split('/').filter(Boolean).pop()+'-'+i;files.push({path:g+nm+'.md',basename:nm});}
const hubs=files.filter(f=>f.path.includes('hubs'));const rl={};
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(const f of files){if(f.path.includes('hubs'))continue;const o=rl[f.path]={};const k=1+Math.floor(rnd()*2.5);for(let i=0;i<k;i++)o[hubs[Math.floor(rnd()*rnd()*hubs.length)].path]=1;
 const same=files.filter(x=>x.path.split('/').slice(0,2).join('/')===f.path.split('/').slice(0,2).join('/'));for(let i=0;i<Math.floor(rnd()*3);i++){const t=same[Math.floor(rnd()*same.length)];if(t!==f)o[t.path]=1;}}
for(const h of hubs){const o=rl[h.path]=rl[h.path]||{};for(let i=0;i<4;i++)o[hubs[Math.floor(rnd()*hubs.length)].path]=1;}
const leaves=[]; const vf={}; const files2=new Map();
const mkLeaf=()=>{const l={app,async setViewState(st){l.view=window.__vf[st.type](l);await l.view.onOpen();}};leaves.push(l);return l;};
const app={vault:{getName:()=>'notes',getMarkdownFiles:()=>files,configDir:'.obsidian',
   getAbstractFileByPath:(p)=>files2.has(p)?{path:p}:(p==='Claude Activity'&&window.__folder?{path:p}:null),
   createFolder:async(p)=>{window.__folder=true;}, create:async(p,c)=>{files2.set(p,c);}, modify:async(f,c)=>{files2.set(f.path,c);}, read:async(f)=>files2.get(f.path)||'',
   adapter:{basePath:'/home/dev/notes',read:async()=>'{}',readBinary:async(p)=>{const n=p.split('/').pop();if(n.endsWith('.gz'))throw new Error('nf');const r=await fetch(n);if(!r.ok)throw new Error('nf');return await r.arrayBuffer();}}},
 metadataCache:{resolvedLinks:rl,on(){return{}},getFileCache:()=>null},
 workspace:{onLayoutReady(cb){setTimeout(cb,0)},getLeavesOfType:(t)=>leaves.filter(l=>l.view&&l.view.getViewType()===t),getLeaf(){return mkLeaf();},getRightLeaf(){return mkLeaf();},revealLeaf(){},openLinkText(p){window.__opened=p;}}};
window.__files2=files2;
window.__cbStart=async()=>{Object.assign(vf,window.__vf||{});const Cls=module.exports.default||module.exports;const p=new Cls(app,{dir:'.'});await p.onload();await p.activateView();window.plugin=p;window.view=leaves[0].view;};
})();</script></body></html>
