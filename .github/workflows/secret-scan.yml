name: Secret scan

# Scans the whole history for keys, tokens and passwords on every push and pull request, so one never reaches the repo.
# (GitHub's own push protection is the first line; this is the second, and it also covers forks' pull requests.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0               # the full history, not only the last commit
          persist-credentials: false   # later steps never need the git token
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7   # v2.3.9, pinned: this job reads every commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
