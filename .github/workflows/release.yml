name: Release

# plugin versions only (0.9.3, no "v"); the anatomy release (anatomy-N) is published by hand and never built here
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write       # create the release
  id-token: write       # sign the build provenance
  attestations: write   # store it

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # later steps never need the git token
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check the tag matches the manifest
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      - name: Attest where the files were built
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
      - name: Release notes from the changelog
        # the text of this version in CHANGELOG.md, as it is: no commit list, no "Full Changelog" link
        run: |
          awk -v v="$GITHUB_REF_NAME" '$0 == "## " v { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || { echo "CHANGELOG.md has no section '## $GITHUB_REF_NAME'"; exit 1; }
      - name: Release (or refresh the files and notes of an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="dist/main.js dist/manifest.json dist/styles.css"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          else gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md $FILES; fi
