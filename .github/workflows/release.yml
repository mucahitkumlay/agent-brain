name: Release

# plugin versions only (0.9.3, no "v"); the anatomy release (anatomy-N) is published by hand and never built here
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  # or by hand (Actions → Release → Run workflow, on main): releases the version in manifest.json and creates its tag
  workflow_dispatch:

permissions:
  contents: write       # create the release
  id-token: write       # sign the build provenance
  attestations: write   # store it

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # later steps never need the git token
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: The version (a pushed tag must match the manifest)
        run: |
          V="$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_EVENT_NAME" = push ]; then test "$V" = "$GITHUB_REF_NAME"; fi
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Attest where the files were built
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
      - name: Release notes from the changelog
        # the text of this version in CHANGELOG.md, as it is: no commit list, no "Full Changelog" link
        run: |
          awk -v v="$V" '$0 == "## " v { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || { echo "CHANGELOG.md has no section '## $V'"; exit 1; }
      - name: Release (or refresh the files and notes of an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="dist/main.js dist/manifest.json dist/styles.css"
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" $FILES --clobber
            gh release edit "$V" --notes-file RELEASE_NOTES.md
          else gh release create "$V" --title "$V" --target "$GITHUB_SHA" --notes-file RELEASE_NOTES.md $FILES; fi
